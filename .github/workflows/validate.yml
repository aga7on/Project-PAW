name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка структуры мода и документов
        run: python tools/validate_mod.py

      - name: Синтаксис python-скриптов
        run: python -m compileall -q tools
